<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For You 💌</title>
  <meta name="theme-color" content="#12061a" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Background effects (made by script.js) -->
  <div id="stars" aria-hidden="true"></div>
  <div id="hearts" aria-hidden="true"></div>

  <!-- ============ SCREEN 1: THE LITTLE BIRD ============ -->
  <section id="intro" class="screen active">
    <div class="bird">🐦</div>
    <div class="bubble" id="bubble">
      <div id="introText"></div>
      <span class="tap-hint">tap to speed up</span>
    </div>
    <button id="startBtn" class="btn hidden"></button>
  </section>

  <!-- ============ SCREEN 2: THE MYSTERY GAME ============ -->
  <section id="game" class="screen">
    <div class="game-wrap">
      <div class="mini-bird">🐦</div>
      <div class="progress" id="progress"></div>
      <div class="card game-card">
        <div class="q-number" id="qNumber"></div>
        <h2 id="question"></h2>
        <div class="options" id="options"></div>
        <p class="feedback" id="feedback"></p>
      </div>
    </div>
  </section>

  <!-- ============ SCREEN 3: FINAL YES / NO ============ -->
  <section id="final" class="screen">
    <div class="card game-card">
      <div class="big-emoji">💞</div>
      <h2 id="finalQuestion"></h2>
      <div class="yesno">
        <button id="yesBtn" class="btn"></button>
        <button id="noBtn" class="btn ghost"></button>
      </div>
      <p class="feedback" id="noFeedback"></p>
    </div>
  </section>

  <!-- ============ SCREEN 4: DREAMLAND ============ -->
  <section id="dreamland" class="screen">
    <div class="moon">🌙</div>
    <h1 class="script glow" id="dreamTitle"></h1>
    <p class="dream-text" id="dreamText"></p>
    <button id="enterBtn" class="btn"></button>
  </section>

  <!-- ============ THE MAIN PAGE ============ -->
  <main id="main" class="hidden">
    <header class="hero">
      <p class="eyebrow">for <span id="heroHer"></span></p>
      <h1 class="script glow" id="heroTitle"></h1>
      <p class="names" id="heroNames"></p>
      <div class="counter" id="counter"></div>
      <p class="counter-label">and counting…</p>
      <p class="hero-sub" id="heroSub"></p>
      <div class="scroll-hint">scroll ↓</div>
    </header>

    <section class="memories">
      <h2 class="section-title script">Our Story</h2>
      <div class="timeline" id="timeline"></div>
    </section>

    <section class="letter-wrap reveal">
      <div class="letter">
        <h2 id="letterTitle"></h2>
        <div id="letterBody"></div>
        <p class="signoff" id="letterSignoff"></p>
        <p class="signature script" id="letterSignature"></p>
      </div>
    </section>

    <footer>
      <p id="footerText"></p>
      <button class="btn ghost small" id="replayBtn">Play the game again 🐦</button>
    </footer>
  </main>

  <!-- Music button + audio -->
  <button id="musicBtn" class="music hidden" aria-label="Play or pause music">
    <span class="disc">🎵</span><span class="music-label" id="musicLabel"></span>
  </button>
  <audio id="song" loop preload="auto"></audio>

  <!-- Full-screen photo viewer -->
  <div id="lightbox" class="lightbox hidden"><img id="lightboxImg" alt="" /></div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
